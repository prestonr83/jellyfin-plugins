name: Build and test plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test packaging and catalog contracts
        run: python -m unittest discover -s scripts/tests -v
      - name: Build, test and package both plugins
        env:
          CATALOG_TAG: ci-${{ github.sha }}
        shell: bash
        run: python scripts/build_repository.py --tag "$CATALOG_TAG"
      - name: Validate release asset checksums
        env:
          CATALOG_TAG: ci-${{ github.sha }}
        shell: bash
        run: python scripts/release_repository.py publish --tag "$CATALOG_TAG" --dry-run
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: jellyfin-plugins-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
